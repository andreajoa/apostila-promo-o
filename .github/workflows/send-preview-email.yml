name: Validar botão do e-mail

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aguardar o deploy da Vercel
        run: sleep 45
      - name: Enviar nova prévia com botão clicável
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            'https://apostila-promo.vercel.app/api/send-email-preview?key=margareth-20260804-email-link-v3-9d2a')
          echo "$response"
          echo "$response" | grep -q '"sent":true'
