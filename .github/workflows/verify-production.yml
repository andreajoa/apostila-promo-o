name: Verificar produção

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Aguardar e verificar página principal
        shell: bash
        run: |
          set -euo pipefail
          URL="https://apostila-promo.vercel.app"
          for attempt in {1..30}; do
            status=$(curl -L -sS -o /tmp/home.html -w '%{http_code}' "$URL/?verify=${GITHUB_SHA}" || true)
            echo "Tentativa $attempt: homepage HTTP $status"
            if [ "$status" = "200" ] && grep -q "Coleção Margareth Almeida" /tmp/home.html; then
              break
            fi
            sleep 10
          done
          test "$status" = "200"
          grep -q "Coleção Margareth Almeida" /tmp/home.html

      - name: Verificar endpoints dos banners
        shell: bash
        run: |
          set -euo pipefail
          for name in a1 a2 a3 a4 b1 b2 b3 b4; do
            URL="https://apostila-promo.vercel.app/api/campaign-banner?name=${name}&verify=${GITHUB_SHA}"
            status=""
            for attempt in {1..12}; do
              status=$(curl -L -sS -D /tmp/banner.headers -o /tmp/banner.svg -w '%{http_code}' "$URL" || true)
              echo "[$name] Tentativa $attempt: HTTP $status; bytes $(wc -c < /tmp/banner.svg 2>/dev/null || echo 0)"
              if [ "$status" = "200" ]; then break; fi
              sleep 10
            done
            test "$status" = "200"
            grep -i -q '^content-type: image/svg+xml' /tmp/banner.headers
            grep -q '<svg' /tmp/banner.svg
            echo "[$name] OK"
          done

      - name: Verificar favicon
        shell: bash
        run: |
          set -euo pipefail
          URL="https://apostila-promo.vercel.app/favicon.ico?verify=${GITHUB_SHA}"
          status=$(curl -L -sS -D /tmp/favicon.headers -o /tmp/favicon.svg -w '%{http_code}' "$URL")
          echo "Favicon HTTP $status; bytes $(wc -c < /tmp/favicon.svg)"
          test "$status" = "200"
          grep -i -q '^content-type: image/svg+xml' /tmp/favicon.headers
          grep -q '<svg' /tmp/favicon.svg
          cat /tmp/favicon.headers
