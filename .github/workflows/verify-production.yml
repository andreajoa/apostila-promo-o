name: Verificar produção

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verificar página principal
        shell: bash
        run: |
          set -euo pipefail
          URL="https://apostila-promo.vercel.app/?verify=${GITHUB_SHA}"
          status=$(curl -L -sS -D /tmp/home.headers -o /tmp/home.html -w '%{http_code}' "$URL")
          echo "Homepage HTTP $status; bytes $(wc -c < /tmp/home.html)"
          test "$status" = "200"
          grep -q "Coleção Margareth Almeida" /tmp/home.html

      - name: Diagnosticar arquivo base64 estático
        shell: bash
        run: |
          set -u
          URL="https://apostila-promo.vercel.app/assets/funnel-atlas-mini.b64?verify=${GITHUB_SHA}"
          status=$(curl -L -sS -D /tmp/atlas.headers -o /tmp/atlas.response -w '%{http_code}' "$URL" || true)
          bytes=$(wc -c < /tmp/atlas.response 2>/dev/null || echo 0)
          prefix=$(head -c 24 /tmp/atlas.response 2>/dev/null || true)
          echo "Base64 HTTP $status; bytes $bytes; prefix: $prefix"
          cat /tmp/atlas.headers || true
          if grep -q '<!doctype html' /tmp/atlas.response; then
            echo "DIAGNOSTICO: a rota do .b64 está retornando o HTML da página principal."
          fi
          exit 0

      - name: Verificar endpoint do banner
        shell: bash
        run: |
          set -u
          URL="https://apostila-promo.vercel.app/api/visual-asset?name=funnel&verify=${GITHUB_SHA}"
          status=$(curl -L -sS -D /tmp/banner.headers -o /tmp/banner.response -w '%{http_code}' "$URL" || true)
          bytes=$(wc -c < /tmp/banner.response 2>/dev/null || echo 0)
          echo "Banner HTTP $status; bytes $bytes"
          echo "--- cabeçalhos ---"
          cat /tmp/banner.headers || true
          echo "--- primeiros 300 bytes ---"
          head -c 300 /tmp/banner.response || true
          echo
          test "$status" = "200"
          grep -i -q '^content-type: image/webp' /tmp/banner.headers
          test "$bytes" -gt 100000
          test "$(head -c 4 /tmp/banner.response)" = "RIFF"
          test "$(dd if=/tmp/banner.response bs=1 skip=8 count=4 2>/dev/null)" = "WEBP"

      - name: Verificar favicon
        shell: bash
        run: |
          set -u
          URL="https://apostila-promo.vercel.app/favicon.ico?verify=${GITHUB_SHA}"
          status=$(curl -L -sS -D /tmp/favicon.headers -o /tmp/favicon.response -w '%{http_code}' "$URL" || true)
          bytes=$(wc -c < /tmp/favicon.response 2>/dev/null || echo 0)
          echo "Favicon HTTP $status; bytes $bytes"
          cat /tmp/favicon.headers || true
          head -c 200 /tmp/favicon.response || true
          echo
          test "$status" = "200"
          grep -i -q '^content-type: image/svg+xml' /tmp/favicon.headers
          grep -q '<svg' /tmp/favicon.response
